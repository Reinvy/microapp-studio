name: ci

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-docs.mjs --strict

  web:
    name: studio-web (test, typecheck, lint, build)
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-web-build
          path: apps/studio-web/.next
          if-no-files-found: ignore

  core-rust:
    name: core-rust (test, clippy)
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Check core crate presence
        id: presence
        run: |
          if [ -f packages/core-rust/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.presence.outputs.present == 'true'
        run: cargo test --manifest-path packages/core-rust/Cargo.toml
      - if: steps.presence.outputs.present == 'true'
        run: cargo clippy --manifest-path packages/core-rust/Cargo.toml --all-targets -- -D warnings
